version: "3.9"

services:
  backoffice:
    image: registry.edumatch.space/edumatch/backoffice:1.0.0
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - m-network
    depends_on:
      - redis

  redis:
    image: redis:7.4.1-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    networks:
      - m-network
    command: >
      redis-server
      --appendonly yes
      --replica-read-only no
      --save 900 1
      --save 300 10
      --save 60 10000
      --loglevel notice
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode no

networks:
  m-network:
    driver: bridge
    name: m-network

volumes:
  redis: