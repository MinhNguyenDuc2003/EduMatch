version: "3.9"

services:
  nginx:
    image:  nginx:1.27.2
    restart: unless-stopped
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/configuration/custom_proxy_settings.conf:/etc/nginx/conf.d/custom_proxy_settings.conf
    ports:
      - "80:80"
    networks:
      - m-network
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      - BASE_URL=/swagger-ui
      - URLS
      - OAUTH_CLIENT_ID=swagger-ui
      - OAUTH_USE_PKCE=true
    networks:
      - m-network
  identity:
    image: quay.io/keycloak/keycloak:26.0.2
    command: 'start-dev --import-realm'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: minh01672527656
      KC_HTTP_PORT: 80
      KC_PROXY: edge
      KC_HOSTNAME: 160.30.113.224
      KC_HTTP_RELATIVE_PATH: /identity
      KC_FRONTEND_URL: http://160.30.113.224/identity
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./identity/themes/yas/theme:/opt/keycloak/themes
    networks:
      - m-network
  postgres:
    image: debezium/postgres:16-alpine
    build: ./docker/postgres
    hostname: ${POSTGRES_HOST}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./docker/postgres/postgresql.conf.sample:/usr/share/postgresql/postgresql.conf.sample
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql
      - postgres:/var/lib/postgresql/data
    command: postgres -c 'max_connections=500' -c 'timezone=UTC'
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    networks:
      - m-network
  pgadmin:
    image: dpage/pgadmin4:2024-10-19-2
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@minh.com
      PGADMIN_DEFAULT_PASSWORD: minh01672527656
      PGADMIN_CONFIG_WSGI_SCRIPT_NAME: /pgadmin
    networks:
      - m-network
  redis:
    image: redis:7.4.1-alpine
    restart: always
    environment:
      - SPRING_DATA_REDIS_HOST
      - SPRING_DATA_REDIS_PORT
    volumes:
      - redis:/data
    networks:
      - m-network
  registry-server:
    image: registry.edumatch.space/edumatch/registry:latest
    #    environment:
    #      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/customer
    #      - SERVER_SERVLET_CONTEXT_PATH=/customer
    #      - YAS_SERVICES_LOCATION
    #      - SERVER_PORT
    #      - LOGGING_CONFIG
    #      - JAVA_TOOL_OPTIONS
    #      - OTEL_EXPORTER_OTLP_ENDPOINT
    #      - OTEL_EXPORTER_OTLP_PROTOCOL
    #      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
    #      - OTEL_RESOURCE_ATTRIBUTES
    #      - OTEL_SERVICE_NAME=customer-service
    #      - OTEL_LOGS_EXPORTER
    #      - OTEL_TRACES_EXPORTER
    #      - OTEL_METRICS_EXPORTER
    #      - OTEL_INSTRUMENTATION_LOGBACK-MDC_ADD-BAGGAGE
    #      - OTEL_JAVAAGENT_LOGGING
    #      - OTEL_JAVAAGENT_ENABLED
    #      - OTEL_JAVAAGENT_DEBUG
    volumes:
      - ./docker/libs/opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar
      - ./deployment/app-config:/app-config
    networks:
      - m-network
  customer:
