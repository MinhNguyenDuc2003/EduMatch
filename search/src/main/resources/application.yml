app:
  environment: '${spring.profiles.environment:local}'
  url:
    eureka: '${env.eureka.url:http://localhost:8761/eureka/}'
  db:
    schema: search
    port: '${env.db.port:5432}'
    endpoint: '${env.db.endpoint:localhost}'
    database: '${env.db.database:postgres}'
    username: '${env.db.username:postgres}'
    password: '${env.db.password:minh01672527656}'
    pool:
      minimum: '${env.db.pool.minimum:2}'
      maximum: '${env.db.pool.maximum:10}'

server:
  port: '${env.port:8091}'
  servlet:
    context-path: /search
  compression:
    enabled: true
  tomcat:
    relaxed-query-chars: '|,{,},[,]'
  max-http-request-header-size: 65536

spring:
  profiles:
    active: dev
  application:
    name: SEARCH
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 2048MB
      file-size-threshold: 2KB
  cloud:
    config:
      enabled: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${env.issuer.uri:http://localhost:8080/realms/Yas}
  kafka:
    bootstrap-servers: ${kafka.bootstrap-server}

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    org.flywaydb: DEBUG
  level:
    org.springframework.messaging: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.web.socket.messaging: DEBUG

springdoc:
  packages-to-scan: com.minh.search
  swagger-ui:
    path: /swagger-ui
    oauth:
      use-pkce-with-authorization-code-grant: true
      client-id: swagger-ui
  oauthflow:
    authorization-url: ${env.authorization.url:http://localhost:8080/realms/Yas/protocol/openid-connect/auth}
    token-url: ${env.token.url:http://localhost:8080/realms/Yas/protocol/openid-connect/token}

resilience4j:
  retry:
    instances:
      rest-api:
        max-attempts: 3

  circuitbreaker:
    instances:
      rest-circuit-breaker:
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 3

eureka:
  instance:
    preferIpAddress: false
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    lease-renewal-interval-in-seconds: 1
    lease-expiration-duration-in-seconds: 1
  client:
    registerWithEureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetchRegistry: ${EUREKA_FETCH_REGISTRY:true}
    serviceUrl:
      defaultZone: '${app.url.eureka}'

kafka:
  enable: true
  bootstrap-server: ${env.kafka.ip:localhost}:${env.kafka.port:29092}
  search:
    new-event:
      topic: ${app.environment:local}.search.new-event
      group: ${app.environment:local}.search.new-event.group
  scholarship:
    cdc:
      topic: ${app.environment:local}.scholarship.cdc
      group: ${app.environment:local}.scholarship.cdc

keycloak:
  auth-server-url: ${env.keycloak.url:http://localhost:8080}
  realm: ${env.keycloak.realm:Yas}
  resource: ${env.keycloak.client-id:backoffice-bff}
  credentials:
    secret: ${env.keycloak.client-secret:TVacLC0cQ8tiiEKiTVerTb2YvwQ1TRJF}

elasticsearch:
  uris: ${env.elasticsearch.url:http://localhost:9200}
  username: ""
  password: ""